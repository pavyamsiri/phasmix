format: phasmix
version: 1
sampler: grid-jitter-v1
grid:
  x:
    min: -100.0
    max: 100.0
    bins: 100
  y:
    min: -100.0
    max: 100.0
    bins: 100
background:
- type: gaussian-v1
  parameters:
    x_scale: 1.0
    y_scale: 1.0
    amplitude: 1.0
    variance: 1.0
signal:
- type: alinder-v1
  parameters:
    alpha: 0.5
    b: 0.2
    c: 0.0
    theta0: 0.0
    scale_factor: 1.0
    rho: 0.09
sampling:
  count: 100000
  seed: 88363
  bit_generator: PCG64
metadata:
  description: Base mock data model for testing Tavangar et al. 2026's BFE method.
